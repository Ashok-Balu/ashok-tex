<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Loom weaving fabric">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="fabric" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <pattern id="weave" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="url(#fabric)"/>
      <rect width="7" height="7" fill="#ffffff" opacity="0.28"/>
      <rect x="7" y="7" width="7" height="7" fill="#ffffff" opacity="0.28"/>
    </pattern>
    <clipPath id="warpClip"><rect x="90" y="60" width="300" height="190"/></clipPath>
  </defs>

  <circle cx="240" cy="180" r="170" fill="url(#bg)"/>
  <circle cx="240" cy="180" r="130" fill="none" stroke="#fff" stroke-opacity="0.18" stroke-dasharray="4 8"/>

  <!-- loom frame -->
  <rect x="70" y="40" width="18" height="240" rx="6" fill="url(#frame)"/>
  <rect x="392" y="40" width="18" height="240" rx="6" fill="url(#frame)"/>
  <rect x="70" y="40" width="340" height="16" rx="6" fill="url(#frame)"/>
  <rect x="70" y="264" width="340" height="16" rx="6" fill="url(#frame)"/>

  <!-- warp threads -->
  <g clip-path="url(#warpClip)" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round">
    <g>
      <line x1="100" y1="60" x2="100" y2="250"/><line x1="120" y1="60" x2="120" y2="250"/>
      <line x1="140" y1="60" x2="140" y2="250"/><line x1="160" y1="60" x2="160" y2="250"/>
      <line x1="180" y1="60" x2="180" y2="250"/><line x1="200" y1="60" x2="200" y2="250"/>
      <line x1="220" y1="60" x2="220" y2="250"/><line x1="240" y1="60" x2="240" y2="250"/>
      <line x1="260" y1="60" x2="260" y2="250"/><line x1="280" y1="60" x2="280" y2="250"/>
      <line x1="300" y1="60" x2="300" y2="250"/><line x1="320" y1="60" x2="320" y2="250"/>
      <line x1="340" y1="60" x2="340" y2="250"/><line x1="360" y1="60" x2="360" y2="250"/>
      <line x1="380" y1="60" x2="380" y2="250"/>
      <animate attributeName="stroke-opacity" values="1;0.55;1" dur="3s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- fabric being woven -->
  <rect x="96" y="170" width="288" height="80" rx="4" fill="url(#weave)"/>
  <rect x="96" y="170" width="288" height="6" fill="#fff" opacity="0.35"/>

  <!-- reed (beater) moving up/down -->
  <g>
    <rect x="92" y="150" width="296" height="14" rx="5" fill="#1e3a8a"/>
    <rect x="92" y="150" width="296" height="4" rx="2" fill="#93c5fd" opacity="0.7"/>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 10; 0 0" dur="2.4s" repeatCount="indefinite"/>
  </g>

  <!-- shuttle -->
  <g>
    <path d="M0 0 L46 0 L56 7 L46 14 L0 14 Z" fill="#ef4444"/>
    <rect x="6" y="5" width="30" height="4" rx="2" fill="#fecaca"/>
    <animateTransform attributeName="transform" type="translate" values="110 120; 320 120; 110 120" dur="4.8s" repeatCount="indefinite"/>
  </g>

  <!-- yarn cones -->
  <g>
    <path d="M20 330 L44 250 L68 330 Z" fill="#f43f5e"/>
    <rect x="20" y="326" width="48" height="8" rx="3" fill="#be123c"/>
    <path d="M410 330 L434 262 L458 330 Z" fill="#22c55e"/>
    <rect x="410" y="326" width="48" height="8" rx="3" fill="#15803d"/>
    <path d="M70 312 C110 290 150 330 190 300" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 6">
      <animate attributeName="stroke-dashoffset" values="0;-24" dur="1.4s" repeatCount="indefinite"/>
    </path>
    <path d="M410 312 C370 290 330 330 290 300" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 6">
      <animate attributeName="stroke-dashoffset" values="0;24" dur="1.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- sparkles -->
  <g fill="#fff">
    <circle cx="60" cy="90" r="3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="110" r="2.5"><animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="24" r="2"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" repeatCount="indefinite"/></circle>
  </g>
</svg>

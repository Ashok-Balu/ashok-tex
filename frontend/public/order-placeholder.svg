<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <pattern id="plaid" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="#E8EEF7"/>
      <rect x="0" y="16" width="80" height="12" fill="#1565C0" opacity="0.35"/>
      <rect x="0" y="48" width="80" height="6" fill="#E65100" opacity="0.35"/>
      <rect x="16" y="0" width="12" height="80" fill="#1565C0" opacity="0.35"/>
      <rect x="48" y="0" width="6" height="80" fill="#2E7D32" opacity="0.35"/>
    </pattern>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eaf2ff"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect width="800" height="600"/></clipPath>
  </defs>
  <rect width="800" height="600" fill="url(#plaid)"/>
  <g clip-path="url(#clip)">
    <rect x="-300" y="0" width="260" height="600" fill="url(#sheen)" transform="skewX(-18)">
      <animate attributeName="x" values="-400;1100" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g>
    <rect x="230" y="200" width="340" height="200" rx="26" fill="url(#card)" stroke="#c9d9f5" stroke-width="2"/>
    <g transform="translate(400 262)">
      <rect x="-34" y="-20" width="68" height="46" rx="10" fill="#1565C0"/>
      <rect x="-14" y="-30" width="28" height="14" rx="5" fill="#1565C0"/>
      <circle cx="0" cy="3" r="14" fill="#fff"/>
      <circle cx="0" cy="3" r="8" fill="#42A5F5"/>
    </g>
    <text x="400" y="352" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#0D1B3E">No order image</text>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="4s" repeatCount="indefinite"/>
  </g>
</svg>

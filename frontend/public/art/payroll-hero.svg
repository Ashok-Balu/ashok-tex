<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Wallet and coins">
  <defs>
    <linearGradient id="w" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.95"/><stop offset="1" stop-color="#e0e7ff" stop-opacity="0.9"/></linearGradient>
    <linearGradient id="c" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
  </defs>
  <ellipse cx="160" cy="184" rx="130" ry="10" fill="#1e1b4b" opacity="0.18"/>
  <!-- wallet -->
  <rect x="70" y="84" width="170" height="96" rx="16" fill="url(#w)"/>
  <rect x="70" y="84" width="170" height="26" rx="12" fill="#c7d2fe" opacity="0.8"/>
  <rect x="196" y="124" width="58" height="30" rx="10" fill="#6366f1"/>
  <circle cx="212" cy="139" r="5" fill="#fff"/>
  <!-- coin stack -->
  <g>
    <ellipse cx="258" cy="168" rx="26" ry="8" fill="#d97706"/>
    <rect x="232" y="152" width="52" height="16" fill="#f59e0b"/>
    <ellipse cx="258" cy="152" rx="26" ry="8" fill="url(#c)"/>
    <ellipse cx="258" cy="140" rx="26" ry="8" fill="#d97706"/>
    <rect x="232" y="128" width="52" height="12" fill="#f59e0b"/>
    <ellipse cx="258" cy="128" rx="26" ry="8" fill="url(#c)"/>
    <text x="258" y="132" text-anchor="middle" font-size="11" font-weight="800" fill="#92400e" font-family="Arial, sans-serif">₹</text>
  </g>
  <!-- flying coins -->
  <g font-family="Arial, sans-serif" font-weight="800" font-size="13" fill="#92400e" text-anchor="middle">
    <g>
      <circle cx="120" cy="52" r="15" fill="url(#c)"/><text x="120" y="57">₹</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -10; 0 0" dur="3s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="176" cy="34" r="12" fill="url(#c)"/><text x="176" y="39" font-size="11">₹</text>
      <animateTransform attributeName="transform" type="translate" values="0 -6; 0 6; 0 -6" dur="3.6s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="226" cy="64" r="10" fill="url(#c)"/><text x="226" y="68" font-size="10">₹</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -8; 0 0" dur="2.6s" repeatCount="indefinite"/>
    </g>
  </g>
  <!-- sparkles -->
  <g fill="#fff">
    <circle cx="60" cy="70" r="3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="290" cy="90" r="2.5"><animate attributeName="opacity" values="1;0.2;1" dur="2.9s" repeatCount="indefinite"/></circle>
  </g>
</svg>
